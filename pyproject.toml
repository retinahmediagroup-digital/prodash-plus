[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prodash"
version = "0.1.0"
description = "ProDash+ data pipeline: CSV landing, cleansing and scoring for Supabase"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "python-dotenv>=1.0",
  "requests>=2.32",
]

[project.optional-dependencies]
notebook = [
  "jupyterlab>=4.2",
  "ipykernel>=6.29",
  "nbstripout>=0.7",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "pandera>=0.20",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["prodash*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
